name: ReadThat
options:
  bundleIdPrefix: dev.readthat
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    READTHAT_API_BASE_URL: "https://sdui-reddit-api.patjackson52.workers.dev"
    READTHAT_DEMO_USERNAME: ""
    READTHAT_DEMO_PASSWORD: ""
  configs:
    Debug:
      READTHAT_ALLOW_LOCAL_HTTP: YES
    Release:
      READTHAT_ALLOW_LOCAL_HTTP: NO
targets:
  ReadThat:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../clients/ios/StreamAssetDownloadManager.swift
        group: Native Shims
    preBuildScripts:
      - name: Build KMP framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.readthat.ios
        PRODUCT_NAME: ReadThat
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ReadThatShared"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ReadThat.entitlements
        DEVELOPMENT_TEAM: 2XAXFD3872
    scheme:
      testTargets: []
      gatherCoverageData: false
