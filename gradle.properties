org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.uniquePackageNames=true
android.dependency.useConstraints=false
kotlin.js.nodejs.download=false
kotlin.js.yarn.download=false

# Public production Worker origin. Override with -PREADTHAT_API_BASE_URL=... for staging.
READTHAT_API_BASE_URL=https://sdui-reddit-api.patjackson52.workers.dev

# The KMP graph and Compose Multiplatform surface are the Android product path.
# Set false only to compile/run the retained mature Android reference during rollback checks.
READTHAT_USE_SHARED_APP=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
